[project]
name = "ensemble-runtime"
version = "0.1.0"
description = "Ensemble Python runtime: org SSoT, stage machine, CrewAI projection, runners"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  # AI multi-agent orchestration framework (locked — D002a / T009)
  "crewai>=0.80.0,<1.0.0",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.0",
  "sse-starlette>=2.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "httpx>=0.27",
]

[project.scripts]
ensemble-runtime = "ensemble_runtime.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["ensemble_runtime*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
