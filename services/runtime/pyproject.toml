[project]
name = "ensemble-runtime"
version = "0.1.0"
description = "Ensemble Python runtime: org SSoT, stage machine, CrewAI projection, runners"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  # AI multi-agent orchestration framework (locked — D002a / T009)
  "crewai>=0.80.0,<1.0.0",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.0",
  "sse-starlette>=2.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "httpx>=0.27",
  "ruff==0.14.14",
  "pytest-asyncio==1.3.0",
  "pyyaml==6.0.3",
]

[project.scripts]
ensemble-runtime = "ensemble_runtime.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["ensemble_runtime*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
  "error",
  'ignore:Using `httpx` with `starlette\.testclient` is deprecated; install `httpx2` instead\.:starlette.exceptions.StarletteDeprecationWarning:fastapi\.testclient',
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
